<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devine le Nombre - V1.1</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #202040;
            color: white;

            padding: 20px;
        }

        .ecran {
            width: 100%;
            max-width: 450px;

            padding: 30px;

            text-align: center;

            background: #303060;

            border-radius: 25px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }

        button {
            display: block;

            width: 100%;

            margin: 12px 0;

            padding: 15px;

            border: none;
            border-radius: 12px;

            font-size: 18px;

            cursor: pointer;

            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.97);
        }

        input {
            width: 130px;

            padding: 14px;

            margin: 10px;

            border: none;
            border-radius: 10px;

            font-size: 22px;

            text-align: center;
        }

        #resultat {
            min-height: 35px;

            font-size: 20px;
            font-weight: bold;
        }

        .cache {
            display: none;
        }

        .succes {
            text-align: left;

            padding: 12px;
            margin: 10px 0;

            border-radius: 12px;

            background: #242450;
        }

        .succes.verrouille {
            opacity: 0.5;
        }

        .rarete {
            font-size: 14px;
        }

        @media (max-width: 500px) {

            body {
                align-items: flex-start;
                padding-top: 25px;
            }

            .ecran {
                padding: 22px;
            }

            h1 {
                font-size: 27px;
            }

            button {
                padding: 17px;
            }
        }

    </style>
</head>


<body>


    <!-- ========================= -->
    <!-- 🏠 ACCUEIL -->
    <!-- ========================= -->

    <div id="accueil" class="ecran">

        <h1>🎮 DEVINE LE NOMBRE</h1>

        <p>
            Bienvenue jeune padawan ! 🧙‍♂️
        </p>

        <p>
            Choisis ton niveau :
        </p>


        <button id="facile">
            🟢 FACILE
            <br>
            <small>1 à 10 • 5 vies</small>
        </button>


        <button id="moyen">
            🔵 MOYEN
            <br>
            <small>1 à 50 • 4 vies</small>
        </button>


        <button id="difficile">
            🔴 DIFFICILE
            <br>
            <small>1 à 100 • 3 vies</small>
        </button>


        <button id="boutonSucces">
            🏆 SUCCÈS
        </button>

    </div>



    <!-- ========================= -->
    <!-- 🎮 JEU -->
    <!-- ========================= -->

    <div id="jeu" class="ecran cache">

        <h1>🎯 DEVINE !</h1>

        <p id="niveau"></p>

        <p id="vies"></p>

        <p id="score"></p>

        <p id="resultat">
            Bonne chance ! 🍀
        </p>


        <input
            id="nombre"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="Nombre"
        >


        <button id="deviner">
            🎯 DEVINER
        </button>


        <button id="rejouer">
            🔄 REJOUER
        </button>

    </div>



    <!-- ========================= -->
    <!-- 🏆 SUCCÈS -->
    <!-- ========================= -->

    <div id="succes" class="ecran cache">

        <h1>🏆 MES SUCCÈS</h1>

        <p id="compteurSucces">
            0 / 10 débloqués
        </p>

        <div id="listeSucces"></div>


        <button id="retourSucces">
            🔙 RETOUR
        </button>

    </div>



    <script>

        // =========================
        // 🎲 VARIABLES DU JEU
        // =========================

        let nombreSecret = 0;
        let vies = 0;
        let essais = 0;
        let maximum = 0;
        let score = 0;

        let difficulte = "";

        let partieTerminee = false;



        // =========================
        // 🏆 LISTE DES SUCCÈS
        // =========================

        const succes = [

            {
                id: "premier_coup",
                nom: "🍀 Premier coup",
                description: "Trouver le nombre du premier essai.",
                rarete: "🟢 Commun"
            },

            {
                id: "bien_joue",
                nom: "🎯 Bien joué !",
                description: "Gagner une partie.",
                rarete: "🟢 Commun"
            },

            {
                id: "padawan",
                nom: "🧙 Padawan",
                description: "Gagner une partie en facile.",
                rarete: "🔵 Rare"
            },

            {
                id: "survivant",
                nom: "❤️ Survivant",
                description: "Gagner avec seulement 1 vie restante.",
                rarete: "🔵 Rare"
            },

            {
                id: "guerrier",
                nom: "⚔️ Guerrier",
                description: "Gagner une partie en moyen.",
                rarete: "🟣 Épique"
            },

            {
                id: "collectionneur",
                nom: "🏆 Collectionneur",
                description: "Débloquer 5 succès.",
                rarete: "🟣 Épique"
            },

            {
                id: "centenaire",
                nom: "💯 Centenaire",
                description: "Gagner une partie avec 100 points.",
                rarete: "🟠 Légendaire"
            },

            {
                id: "maitre",
                nom: "🔥 Maître",
                description: "Gagner une partie en difficile.",
                rarete: "🟠 Légendaire"
            },

            {
                id: "triple_maitre",
                nom: "👑 Triple Maître",
                description:
                    "Gagner 3 parties difficiles d'affilée en 2 coups maximum.",
                rarete: "🔴 Mythique"
            },

            {
                id: "eclair",
                nom: "⚡ Éclair",
                description:
                    "Gagner 5 parties difficiles d'affilée avec 100 points.",
                rarete: "🔴 Mythique"
            }

        ];



        // =========================
        // 💾 CHARGER LES SUCCÈS
        // =========================

        let succesDebloques =
            JSON.parse(
                localStorage.getItem("succesDevineNombre")
            ) || [];



        // =========================
        // 📊 AUTRES DONNÉES
        // =========================

        let serieDifficile2 = 0;

        let serieEclair = 0;



        // =========================
        // 🏆 AFFICHER LES SUCCÈS
        // =========================

        function afficherSucces() {

            const liste =
                document.getElementById("listeSucces");

            liste.innerHTML = "";


            succes.forEach(function (s) {

                const element =
                    document.createElement("div");

                const estDebloque =
                    succesDebloques.includes(s.id);


                element.className =
                    "succes " +
                    (estDebloque ? "" : "verrouille");


                element.innerHTML =

                    (estDebloque ? "🟩 " : "🔒 ") +

                    "<strong>" +
                    s.nom +
                    "</strong>" +

                    "<br>" +

                    "<span class='rarete'>" +
                    s.rarete +
                    "</span>" +

                    "<br>" +

                    "<small>" +
                    s.description +
                    "</small>";


                liste.appendChild(element);

            });


            document
                .getElementById("compteurSucces")
                .textContent =
                succesDebloques.length +
                " / " +
                succes.length +
                " débloqués";

        }



        // =========================
        // 🔓 DÉBLOQUER UN SUCCÈS
        // =========================

        function debloquerSucces(id) {

            if (succesDebloques.includes(id)) {
                return;
            }


            succesDebloques.push(id);


            localStorage.setItem(
                "succesDevineNombre",
                JSON.stringify(succesDebloques)
            );


            const succesTrouve =
                succes.find(function (s) {
                    return s.id === id;
                });


            if (succesTrouve) {

                alert(
                    "🏆 SUCCÈS DÉBLOQUÉ !\n\n" +
                    succesTrouve.nom +
                    "\n" +
                    succesTrouve.description
                );

            }


            afficherSucces();

        }



        // =========================
        // 🎮 COMMENCER UNE PARTIE
        // =========================

        function commencerJeu(max, nombreVies, niveau) {

            maximum = max;

            vies = nombreVies;

            difficulte = niveau;

            essais = 0;

            score = 100;

            partieTerminee = false;


            nombreSecret =
                Math.floor(
                    Math.random() * maximum
                ) + 1;


            document
                .getElementById("accueil")
                .classList.add("cache");


            document
                .getElementById("succes")
                .classList.add("cache");


            document
                .getElementById("jeu")
                .classList.remove("cache");


            document
                .getElementById("niveau")
                .textContent =
                "🎯 " +
                niveau +
                " : nombre entre 1 et " +
                maximum;


            document
                .getElementById("vies")
                .textContent =
                "❤️ Vies : " +
                vies;


            document
                .getElementById("score")
                .textContent =
                "🏆 Score : " +
                score;


            document
                .getElementById("resultat")
                .textContent =
                "Bonne chance ! 🍀";


            document
                .getElementById("nombre")
                .value = "";

        }



        // =========================
        // 🎯 DEVINER
        // =========================

        function deviner() {

            if (partieTerminee) {
                return;
            }


            let nombre =
                Number(
                    document
                        .getElementById("nombre")
                        .value
                );


            if (
                !Number.isInteger(nombre) ||
                nombre < 1 ||
                nombre > maximum
            ) {

                document
                    .getElementById("resultat")
                    .textContent =
                    "⚠️ Choisis un nombre entre 1 et " +
                    maximum + " !";

                return;
            }


            essais++;


            // =========================
            // 🎉 VICTOIRE
            // =========================

            if (nombre === nombreSecret) {

                partieTerminee = true;


                // 🍀 Premier coup

                if (essais === 1) {
                    debloquerSucces("premier_coup");
                }


                // 🎯 Bien joué

                debloquerSucces("bien_joue");


                // 🧙 Padawan

                if (difficulte === "Facile") {
                    debloquerSucces("padawan");
                }


                // ⚔️ Guerrier

                if (difficulte === "Moyen") {
                    debloquerSucces("guerrier");
                }


                // 🔥 Maître

                if (difficulte === "Difficile") {
                    debloquerSucces("maitre");
                }


                // ❤️ Survivant

                if (vies === 1) {
                    debloquerSucces("survivant");
                }


                // 💯 Centenaire

                if (score === 100) {
                    debloquerSucces("centenaire");
                }


                // 👑 Triple Maître

                if (
                    difficulte === "Difficile" &&
                    essais <= 2
                ) {

                    serieDifficile2++;

                } else {

                    serieDifficile2 = 0;

                }


                if (serieDifficile2 >= 3) {

                    debloquerSucces(
                        "triple_maitre"
                    );

                }


                // ⚡ Éclair

                if (
                    difficulte === "Difficile" &&
                    score === 100
                ) {

                    serieEclair++;

                } else {

                    serieEclair = 0;

                }


                if (serieEclair >= 5) {

                    debloquerSucces(
                        "eclair"
                    );

                }


                document
                    .getElementById("resultat")
                    .textContent =
                    "🎉 BRAVO ! Tu as trouvé !";


                document
                    .getElementById("score")
                    .textContent =
                    "🏆 Score : " +
                    score +
                    " • " +
                    essais +
                    " essai(s)";


                // 🏆 Collectionneur

                if (
                    succesDebloques.length >= 5
                ) {

                    debloquerSucces(
                        "collectionneur"
                    );

                }


                return;
            }



            // =========================
            // ❌ MAUVAISE RÉPONSE
            // =========================

            vies--;

            score = Math.max(
                0,
                score - 20
            );


            if (nombre > nombreSecret) {

                document
                    .getElementById("resultat")
                    .textContent =
                    "⬆️ Trop grand !";

            } else {

                document
                    .getElementById("resultat")
                    .textContent =
                    "⬇️ Trop petit !";

            }


            document
                .getElementById("vies")
                .textContent =
                "❤️ Vies : " +
                vies;


            document
                .getElementById("score")
                .textContent =
                "🏆 Score : " +
                score;



            // 💀 GAME OVER

            if (vies === 0) {

                partieTerminee = true;

                serieDifficile2 = 0;

                serieEclair = 0;


                document
                    .getElementById("resultat")
                    .textContent =
                    "💀 GAME OVER !";


                document
                    .getElementById("score")
                    .textContent =
                    "Le nombre était " +
                    nombreSecret +
                    " • Score : " +
                    score;

            }

        }



        // =========================
        // 🔄 RETOUR ACCUEIL
        // =========================

        function retourAccueil() {

            document
                .getElementById("jeu")
                .classList.add("cache");


            document
                .getElementById("accueil")
                .classList.remove("cache");

        }



        // =========================
        // 🏆 OUVRIR SUCCÈS
        // =========================

        document
            .getElementById("boutonSucces")
            .addEventListener(
                "click",
                function () {

                    document
                        .getElementById("accueil")
                        .classList.add("cache");


                    document
                        .getElementById("succes")
                        .classList.remove("cache");


                    afficherSucces();

                }
            );



        // =========================
        // 🔙 RETOUR SUCCÈS
        // =========================

        document
            .getElementById("retourSucces")
            .addEventListener(
                "click",
                function () {

                    document
                        .getElementById("succes")
                        .classList.add("cache");


                    document
                        .getElementById("accueil")
                        .classList.remove("cache");

                }
            );



        // =========================
        // 🎮 BOUTONS DIFFICULTÉ
        // =========================

        document
            .getElementById("facile")
            .addEventListener(
                "click",
                function () {

                    commencerJeu(
                        10,
                        5,
                        "Facile"
                    );

                }
            );


        document
            .getElementById("moyen")
            .addEventListener(
                "click",
                function () {

                    commencerJeu(
                        50,
                        4,
                        "Moyen"
                    );

                }
            );


        document
            .getElementById("difficile")
            .addEventListener(
                "click",
                function () {

                    commencerJeu(
                        100,
                        3,
                        "Difficile"
                    );

                }
            );



        // =========================
        // 🎯 BOUTON DEVINER
        // =========================

        document
            .getElementById("deviner")
            .addEventListener(
                "click",
                deviner
            );



        // =========================
        // 🔄 BOUTON REJOUER
        // =========================

        document
            .getElementById("rejouer")
            .addEventListener(
                "click",
                retourAccueil
            );



        // =========================
        // ⌨️ TOUCHE ENTRÉE
        // =========================

        document
            .getElementById("nombre")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {
                        deviner();
                    }
 
                }
            );


        // 🏆 Charger l'affichage

        afficherSucces();

    </script>

</body>

</html>
