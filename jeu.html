```html
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Devine le nombre</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #202040;
            color: white;

            padding: 20px;

            overflow-x: hidden;
        }

        .ecran {
            width: 100%;
            max-width: 450px;

            padding: 30px;

            text-align: center;

            background: #303060;

            border-radius: 25px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }

        button {
            display: block;

            width: 100%;

            margin: 12px 0;

            padding: 16px;

            min-height: 55px;

            border: none;
            border-radius: 12px;

            font-size: 18px;

            cursor: pointer;

            /* Très important pour le tactile */
            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.97);
        }

        input {
            width: 150px;

            padding: 14px;

            margin: 10px;

            border: none;

            border-radius: 10px;

            font-size: 22px;

            text-align: center;

            touch-action: manipulation;
        }

        #resultat {
            min-height: 35px;

            font-size: 20px;

            font-weight: bold;
        }

        .petit {
            font-size: 14px;
            opacity: 0.7;
        }

        .cache {
            display: none !important;
        }

        @media (max-width: 500px) {

            body {
                align-items: flex-start;
                padding: 15px;
            }

            .ecran {
                padding: 20px;
            }

            h1 {
                font-size: 27px;
            }

            button {
                min-height: 60px;
                padding: 17px;
            }

            input {
                width: 100%;
                max-width: 180px;
                min-height: 55px;
            }
        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- 🏠 ACCUEIL -->
    <!-- ========================= -->

    <div id="accueil" class="ecran">

        <h1>🎮 DEVINE LE NOMBRE</h1>

        <p>
            Bienvenue jeune padawan ! 🧙‍♂️
        </p>

        <p>
            Choisis ton niveau :
        </p>


        <button id="facile" type="button">
            🟢 FACILE
            <br>
            <span class="petit">
                1 à 10 • 5 vies
            </span>
        </button>


        <button id="moyen" type="button">
            🟠 MOYEN
            <br>
            <span class="petit">
                1 à 50 • 4 vies
            </span>
        </button>


        <button id="difficile" type="button">
            🔴 DIFFICILE
            <br>
            <span class="petit">
                1 à 100 • 3 vies
            </span>
        </button>


        <button id="partager" type="button">
            📤 PARTAGER
        </button>

    </div>



    <!-- ========================= -->
    <!-- 🎮 JEU -->
    <!-- ========================= -->

    <div id="jeu" class="ecran cache">

        <h1>🎯 DEVINE !</h1>

        <p id="niveau"></p>

        <p id="vies"></p>

        <p id="score"></p>

        <p id="resultat">
            Bonne chance ! 🍀
        </p>


        <input
            id="nombre"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="Nombre"
            autocomplete="off"
        >


        <button id="deviner" type="button">
            🎯 DEVINER
        </button>


        <button id="rejouer" type="button">
            🔄 REJOUER
        </button>

    </div>



    <script>

        // =========================
        // 🎲 VARIABLES
        // =========================

        let nombreSecret = 0;
        let vies = 0;
        let essais = 0;
        let maximum = 0;
        let score = 0;
        let partieTerminee = false;



        // =========================
        // 🎮 COMMENCER LE JEU
        // =========================

        function commencerJeu(max, nombreVies) {

            maximum = max;
            vies = nombreVies;
            essais = 0;
            score = 100;
            partieTerminee = false;


            nombreSecret =
                Math.floor(Math.random() * maximum) + 1;


            document
                .getElementById("accueil")
                .classList.add("cache");


            document
                .getElementById("jeu")
                .classList.remove("cache");


            document
                .getElementById("niveau")
                .textContent =
                "Trouve un nombre entre 1 et " + maximum;


            document
                .getElementById("vies")
                .textContent =
                "❤️ Vies : " + vies;


            document
                .getElementById("score")
                .textContent =
                "🏆 Score : " + score;


            document
                .getElementById("resultat")
                .textContent =
                "Bonne chance ! 🍀";


            document
                .getElementById("nombre")
                .value = "";

        }



        // =========================
        // 🎯 DEVINER
        // =========================

        function deviner() {

            if (partieTerminee) {
                return;
            }


            const champ =
                document.getElementById("nombre");


            const nombre =
                Number(champ.value);


            if (
                !Number.isInteger(nombre) ||
                nombre < 1 ||
                nombre > maximum
            ) {

                document
                    .getElementById("resultat")
                    .textContent =
                    "⚠️ Choisis un nombre entre 1 et " +
                    maximum + " !";

                return;
            }


            essais++;



            // =========================
            // 🎉 VICTOIRE
            // =========================

            if (nombre === nombreSecret) {

                partieTerminee = true;


                document
                    .getElementById("resultat")
                    .textContent =
                    "🎉 BRAVO ! Tu as trouvé !";


                document
                    .getElementById("score")
                    .textContent =
                    "🏆 Score : " +
                    score +
                    " • " +
                    essais +
                    " essai(s)";

                return;
            }



            // =========================
            // ❌ MAUVAISE RÉPONSE
            // =========================

            vies--;

            score =
                Math.max(0, score - 20);


            if (nombre > nombreSecret) {

                document
                    .getElementById("resultat")
                    .textContent =
                    "⬆️ Trop grand !";

            } else {

                document
                    .getElementById("resultat")
                    .textContent =
                    "⬇️ Trop petit !";
            }


            document
                .getElementById("vies")
                .textContent =
                "❤️ Vies : " + vies;


            document
                .getElementById("score")
                .textContent =
                "🏆 Score : " + score;



            // =========================
            // 💀 GAME OVER
            // =========================

            if (vies === 0) {

                partieTerminee = true;


                document
                    .getElementById("resultat")
                    .textContent =
                    "💀 GAME OVER !";


                document
                    .getElementById("score")
                    .textContent =
                    "Le nombre était " +
                    nombreSecret +
                    " • Score : " +
                    score;
            }

        }



        // =========================
        // 🔄 RETOUR ACCUEIL
        // =========================

        function retourAccueil() {

            document
                .getElementById("jeu")
                .classList.add("cache");


            document
                .getElementById("accueil")
                .classList.remove("cache");

        }



        // =========================
        // 📤 PARTAGER
        // =========================

        async function partager() {

            const texte =
                "🎮 Viens jouer à mon jeu DEVINE LE NOMBRE !";


            if (navigator.share) {

                try {

                    await navigator.share({

                        title:
                            "Devine le nombre",

                        text:
                            texte,

                        url:
                            window.location.href

                    });

                } catch (erreur) {

                    // Partage annulé.
                }

            } else {

                try {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    alert("🔗 Lien copié !");

                } catch (erreur) {

                    alert(
                        "📋 Copie l'adresse de cette page pour la partager."
                    );

                }

            }

        }



        // =========================
        // 📱 SYSTÈME DE CLIC
        // =========================

        function clicTactile(element, action) {

            element.addEventListener(
                "pointerup",
                function (event) {

                    event.preventDefault();

                    action();

                }
            );

        }



        // =========================
        // 🎮 RÉCUPÉRATION DES BOUTONS
        // =========================

        const boutonFacile =
            document.getElementById("facile");

        const boutonMoyen =
            document.getElementById("moyen");

        const boutonDifficile =
            document.getElementById("difficile");

        const boutonDeviner =
            document.getElementById("deviner");

        const boutonRejouer =
            document.getElementById("rejouer");

        const boutonPartager =
            document.getElementById("partager");



        // =========================
        // 🟢 FACILE
        // =========================

        clicTactile(
            boutonFacile,
            function () {

                commencerJeu(10, 5);

            }
        );



        // =========================
        // 🟠 MOYEN
        // =========================

        clicTactile(
            boutonMoyen,
            function () {

                commencerJeu(50, 4);

            }
        );



        // =========================
        // 🔴 DIFFICILE
        // =========================

        clicTactile(
            boutonDifficile,
            function () {

                commencerJeu(100, 3);

            }
        );



        // =========================
        // 🎯 DEVINER
        // =========================

        clicTactile(
            boutonDeviner,
            function () {

                deviner();

            }
        );



        // =========================
        // 🔄 REJOUER
        // =========================

        clicTactile(
            boutonRejouer,
            function () {

                retourAccueil();

            }
        );



        // =========================
        // 📤 PARTAGER
        // =========================

        clicTactile(
            boutonPartager,
            function () {

                partager();

            }
        );



        // =========================
        // ⌨️ ENTRÉE
        // =========================

        document
            .getElementById("nombre")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        deviner();

                    }

                }
            );

    </script>

</body>

</html>
